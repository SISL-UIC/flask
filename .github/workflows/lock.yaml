name: Lock inactive closed issues
permissions: {}
concurrency:
  group: lock
  cancel-in-progress: true
jobs:
  lock:
    runs-on: self-hosted
    permissions:
      issues: write
      pull-requests: write
      discussions: write
    steps:
    - uses: dessant/lock-threads@7266a7ce5c1df01b1c6db85bf8cd86c737dadbe7
      with:
        issue-inactive-days: 14
        pr-inactive-days: 14
        discussion-inactive-days: 14
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  schedule:
  - cron: 0 0 * * *
